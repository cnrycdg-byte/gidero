name: Veritabanını Supabase'e kur

# main dalına yeni migration geldiğinde: önce testler, sonra Supabase projesine uygulama.
# Gerekli GitHub gizli ayarları (Settings > Secrets and variables > Actions):
#   SUPABASE_DB_PASSWORD   - projenin veritabanı şifresi
#   SUPABASE_PROJECT_REF   - proje kimliği (Project Settings > General > Reference ID)
# Bunlar tanımlı değilse kurulum adımı atlanır, testler yine çalışır.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/db-deploy.yml'
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: PostgreSQL araçlarını hazırla
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16 >/dev/null
      - name: Migration ve RLS testleri
        run: PGBIN=/usr/lib/postgresql/16/bin ./scripts/test-db.sh

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - name: Gizli ayarları kontrol et
        id: check
        run: |
          if [ -n "$SUPABASE_DB_PASSWORD" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Supabase gizli ayarları tanımlı değil; kurulum atlandı."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'true'
        with:
          version: 2.122.0
      - name: Veritabanı bağlantısını bul
        id: db
        if: steps.check.outputs.ready == 'true'
        run: |
          # Supabase bağlantı havuzu (IPv4, oturum modu). Bölge: Frankfurt.
          enc=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"],safe=""))')
          for h in aws-1-eu-central-1 aws-0-eu-central-1; do
            host="$h.pooler.supabase.com"
            if PGPASSWORD="$SUPABASE_DB_PASSWORD" PGCONNECT_TIMEOUT=10 psql \
                 "host=$host port=5432 dbname=postgres user=postgres.$SUPABASE_PROJECT_REF sslmode=require" \
                 -tAc 'select 1' >/dev/null 2>err.txt; then
              url="postgresql://postgres.$SUPABASE_PROJECT_REF:$enc@$host:5432/postgres"
              echo "::add-mask::$url"
              echo "url=$url" >> "$GITHUB_OUTPUT"
              echo "Bağlandı: $host"
              exit 0
            fi
            echo "$host: $(tail -1 err.txt)"
          done
          echo "::error title=Veritabanı bağlantısı::Bağlantı kurulamadı: $(tail -1 err.txt | cut -c1-400)"
          exit 1
      - name: Migration'ları uygula
        if: steps.check.outputs.ready == 'true'
        env:
          DB_URL: ${{ steps.db.outputs.url }}
        run: |
          set +e
          out=$(supabase db push --db-url "$DB_URL" --include-all 2>&1); code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            echo "::error title=supabase db push::$(echo "$out" | grep -v '^\s*$' | tail -8 | tr '\n' ' ' | cut -c1-900)"
            exit $code
          fi
