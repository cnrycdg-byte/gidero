name: Giriş ayarlarını uygula

# Supabase Auth: e-posta bağlantılarının (doğrulama, şifre yenileme) uygulamaya dönmesi için adres ayarları.
# Elle çalıştırılır. Gerekli gizli ayarlar: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-24.04
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      APP_URL: https://gidero.expo.app
    steps:
      - name: Ayarları uygula ve doğrula
        run: |
          set -u
          [ -n "$TOKEN" ] || { echo "::error::SUPABASE_ACCESS_TOKEN tanımlı değil"; exit 1; }
          [ -n "$REF" ] || { echo "::error::SUPABASE_PROJECT_REF tanımlı değil"; exit 1; }
          api="https://api.supabase.com/v1/projects/$REF/config/auth"
          before=$(curl -sS -w '\n%{http_code}' -H "Authorization: Bearer $TOKEN" "$api")
          echo "::notice title=Önce::HTTP $(echo "$before" | tail -1) $(echo "$before" | head -n -1 | jq -c '{site_url, uri_allow_list, smtp: ((.smtp_host // "") != ""), rate_limit_email_sent}' 2>/dev/null || echo "$before" | head -c 300)"
          body=$(jq -n --arg u "$APP_URL" '{site_url: $u, uri_allow_list: ($u + "/**")}')
          after=$(curl -sS -w '\n%{http_code}' -X PATCH -H "Authorization: Bearer $TOKEN" -H "content-type: application/json" "$api" -d "$body")
          code=$(echo "$after" | tail -1)
          echo "::notice title=Sonra::HTTP $code $(echo "$after" | head -n -1 | jq -c '{site_url, uri_allow_list}' 2>/dev/null || echo "$after" | head -c 300)"
          [ "$code" = "200" ] || exit 1
