name: Veritabanı testleri

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL araçlarını hazırla
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16 >/dev/null
      - name: Migration ve RLS testleri
        run: PGBIN=/usr/lib/postgresql/16/bin ./scripts/test-db.sh
