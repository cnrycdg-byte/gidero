name: Sunucu fonksiyonlarını kur

# main dalına sunucu fonksiyonu değişikliği geldiğinde: testler, tip kontrolü, ardından Supabase'e kurulum.
# Gerekli GitHub gizli ayarları:
#   SUPABASE_ACCESS_TOKEN  - izinleri: Project Settings (Read) + Edge Functions (Read & write)
#   SUPABASE_PROJECT_REF
# Fonksiyonun kendi gizli ayarı (ANTHROPIC_API_KEY) Supabase panelinde Edge Functions > Secrets altında tutulur.

# Şimdilik yalnızca elle çalıştırılır (Actions > Sunucu fonksiyonlarını kur > Run workflow).
# Anthropic anahtarı ve fonksiyon izni hazır olunca otomatik tetikleme açılacak.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/functions/**'

concurrency:
  group: supabase-functions-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Birim testleri
        run: node --test supabase/functions/_shared/receipt/test/receipt.test.ts supabase/functions/_shared/payments/test/iyzico.test.ts supabase/functions/_shared/sitechat/test/chat.test.ts supabase/functions/_shared/notify/test/send.test.ts
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Tip kontrolü
        working-directory: supabase/functions
        run: deno check read-receipt/index.ts payments/index.ts site-chat/index.ts notify/index.ts

  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - name: Gizli ayarları kontrol et
        id: check
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Supabase gizli ayarları tanımlı değil; kurulum atlandı."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'true'
        with:
          version: 2.122.0
      - name: Fonksiyonları kur (read-receipt, payments, site-chat, notify)
        if: steps.check.outputs.ready == 'true'
        run: |
          set +e
          for fn in read-receipt payments site-chat notify; do
            out=$(supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --use-api 2>&1); code=$?
            echo "$out"
            if [ $code -ne 0 ]; then
              echo "::error title=supabase functions deploy $fn::$(echo "$out" | grep -v '^\s*$' | tail -6 | tr '\n' ' ' | cut -c1-900)"
              exit $code
            fi
          done
